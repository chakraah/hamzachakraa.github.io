<script>const PUBS = [
  { year: 2026, kind: "conference", title: "", venue: "IMAV 2026 — decentralized PSO guidance for multi-UAV wildfire monitoring" },
  { year: null, kind: "journal",    title: "", venue: "Robotics and Autonomous Systems (Elsevier)" },
  { year: null, kind: "journal",    title: "", venue: "IEEE Access" },
  { year: null, kind: "journal",    title: "", venue: "Transactions of the Institute of Measurement and Control" },
  { year: null, kind: "conference", title: "", venue: "ICUAS" },
  { year: null, kind: "conference", title: "", venue: "AIAA SciTech" },
  { year: null, kind: "conference", title: "", venue: "IEEE CASE" },
  { year: null, kind: "conference", title: "", venue: "CoDIT" },
];
const ul = document.getElementById("pubs");
function render(k) {
  ul.innerHTML = "";
  PUBS.filter(p => k === "all" || p.kind === k).forEach(p => {
    const li = document.createElement("li"); li.className = "pub";
    const y = document.createElement("div"); y.className = "pub-year"; y.textContent = p.year ?? "—";
    const b = document.createElement("div");
    const t = document.createElement("div");
    t.className = "pub-title" + (p.title ? "" : " todo");
    t.textContent = p.title || "Title to add";
    const v = document.createElement("div"); v.className = "pub-venue"; v.textContent = p.venue;
    const tag = document.createElement("span"); tag.className = "pub-kind"; tag.textContent = p.kind;
    v.appendChild(tag);
    b.append(t, v); li.append(y, b); ul.appendChild(li);
  });
}
document.querySelectorAll(".filters button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filters button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    render(btn.dataset.k);
  });
});
render("all");</script>
